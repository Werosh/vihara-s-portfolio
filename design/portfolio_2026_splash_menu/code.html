<div class="flex items-center gap-4">
<span class="cursor-indicator w-2 h-2 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-200 shadow-[0_0_8px_#b8a9e6]" style="background-color: #b8a9e6;"></span>

<!-- OPTIONS Option -->
<button class="menu-item group w-full flex items-center justify-between px-6 py-3.5 rounded-lg bg-surface-container-low/60 hover:bg-surface-container text-left transition-all duration-300 cursor-pointer border border-transparent hover:border-[#b8a9e6]/25 hover:shadow-[0_0_24px_rgba(184,169,230,0.18)]" onclick="selectMenu(this, 'OPTIONS')" type="button">
<div class="flex items-center gap-4">
<span class="cursor-indicator w-2 h-2 rounded-full opacity-0 group-hover:opacity-100 transition-opacity duration-200 shadow-[0_0_6px_#b8a9e6]" style="background-color: #b8a9e6;"></span>

<!-- Client Interaction Logic -->
<script>
    function selectMenu(button, action) {
      const msgBox = document.getElementById('hud-message');
      
      // Update HUD message based on selection
      if (action === 'START') {
        msgBox.innerHTML = '<span class="material-symbols-outlined text-xs">rocket_launch</span> ACCESSING ARCHIVES: YUDHA & RASHMI 2026 RECAP...';
        msgBox.classList.add('text-primary');
        msgBox.classList.remove('text-secondary');
      } else if (action === 'OPTIONS') {
        msgBox.innerHTML = '<span class="material-symbols-outlined text-xs">tune</span> AUDIO & DISPLAY CONFIGURATION INITIALIZED.';
        msgBox.classList.add('text-primary');
        msgBox.classList.remove('text-secondary');
      } else if (action === 'EXIT') {
        msgBox.innerHTML = '<span class="material-symbols-outlined text-xs">power_settings_new</span> DISCONNECTING SESSION LINK...';
        msgBox.classList.add('text-secondary');
        msgBox.classList.remove('text-primary');
      }

      // Visual pulse response on click
      button.classList.add('scale-[0.98]');
      setTimeout(() => button.classList.remove('scale-[0.98]'), 150);
    }

    // Interactive Audio Toggle
    const audioBtn = document.getElementById('audio-toggle');
    let soundActive = true;
    audioBtn.addEventListener('click', () => {
      soundActive = !soundActive;
      audioBtn.innerHTML = soundActive 
        ? '<span class="material-symbols-outlined text-sm">volume_up</span>' 
        : '<span class="material-symbols-outlined text-sm">volume_off</span>';
      
      const msgBox = document.getElementById('hud-message');
      msgBox.innerHTML = soundActive 
        ? '<span class="material-symbols-outlined text-xs">volume_up</span> HUD AUDIO ENABLED' 
        : '<span class="material-symbols-outlined text-xs">volume_off</span> HUD AUDIO MUTED';
    });

    // Keyboard Navigation for Game Menu feel
    document.addEventListener('keydown', (e) => {
      const items = Array.from(document.querySelectorAll('.menu-item'));
      const activeIdx = items.findIndex(el => el === document.activeElement);

      if (e.key === 'ArrowDown' || e.key.toLowerCase() === 's') {
        e.preventDefault();
        const next = (activeIdx + 1) % items.length;
        items[next].focus();
      } else if (e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') {
        e.preventDefault();
        const prev = activeIdx <= 0 ? items.length - 1 : activeIdx - 1;
        items[prev].focus();
      } else if (e.key === 'Enter') {
        if (activeIdx !== -1) {
          items[activeIdx].click();
        } else {
          items[0].click();
        }
      }
    });
  </script>
